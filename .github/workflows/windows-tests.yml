# NightScribe - Windows unit tests
#
# Why this exists: the only Windows run used to be the preview BUILD, which
# triggers on main, takes ~13 minutes and publishes a release. So a pull
# request could be reviewed, approved and merged with a suite that does not
# even run on Windows, and the signal only arrived after the merge: that is
# exactly what happened on 2026-10-01 (18 failures on main, all of them
# platform-specific, merged from a green-looking PR).
#
# This one runs the suite alone, on every pull request, in a few minutes and
# without touching the releases.

name: Windows tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      only:
        description: "pytest target (default: the whole unit suite)"
        required: false
        default: ""
      serial:
        description: "run the suite serially (the strict signal, slow)"
        required: false
        default: ""
      qpa:
        description: "QT_QPA_PLATFORM (default: the tests' own, offscreen)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: windows-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (Windows)
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: ${{ github.event.inputs.qpa }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install -r requirements-dev.txt

      - name: Unit tests
        # The SAME command the Linux job runs: -n auto --dist loadfile, one
        # process per file. It used to be a serial run, on purpose (a serial
        # run is the stricter signal: it catches tests that leak state into
        # each other), but on this runner 2588 tests serially are 45-65
        # minutes, the job kept landing at the timeout, and the isolation
        # bugs it found were ones the Linux signal does not catch either: the
        # CI was red for a long stretch of runs and taught nobody anything.
        # Now the two platforms give the SAME signal, and `serial: true`
        # (dispatch) is there for when the strict one is what you want.
        #
        # The dispatch inputs are for chasing a Windows-only failure without
        # paying for the whole suite: `only` runs one or more files and `qpa`
        # swaps QT_QPA_PLATFORM, which is how a platform plugin's own bug is
        # told apart from the app's.
        timeout-minutes: 60
        # 100 minutes, measured: the suite takes ~1m serially on this machine
        # and that runner is far slower than five times that, so the job has
        # been landing at 65-70 minutes and was killed at 99% (run #58). The
        # limit is a net for a genuine hang, not a budget: the tests that
        # made it much worse have been fixed (apply_theme was re-polishing
        # every live widget on every fixture, and one test re-themed the app
        # for every file that ran after it).
        #
        # The original note, for the record:
        # 45 minutes, measured: the suite takes 7m38s serially on this
        # machine and that runner is about five times slower (the live
        # session test alone is 30s, the workbench fixtures 24s each, the
        # transit fits 17s), so ~38 minutes plus the install. A tighter
        # bound does not fail faster, it fails later with the suite cut in
        # half: the first runs did exactly that (66 % in 25 minutes).
        shell: pwsh
        run: |
          $only = "${{ github.event.inputs.only }}"
          $serial = "${{ github.event.inputs.serial }}"
          if ($only) {
            python -m pytest $only.Split(" ") -v
          } elseif ($serial) {
            # the strict signal: ONE process, so tests that leak state into
            # each other show up here and nowhere else
            python -m pytest tests/unit -v
          } else {
            # the same command the Linux job runs: one worker per file
            python -m pytest tests/unit -n auto --dist loadfile -v
          }

