# NightScribe - Windows unit tests
#
# Why this exists: the only Windows run used to be the preview BUILD, which
# triggers on main, takes ~13 minutes and publishes a release. So a pull
# request could be reviewed, approved and merged with a suite that does not
# even run on Windows, and the signal only arrived after the merge: that is
# exactly what happened on 2026-10-01 (18 failures on main, all of them
# platform-specific, merged from a green-looking PR).
#
# This one runs the suite alone, on every pull request, in a few minutes and
# without touching the releases.

name: Windows tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      only:
        description: "pytest target (default: the whole unit suite)"
        required: false
        default: ""
      qpa:
        description: "QT_QPA_PLATFORM (default: the tests' own, offscreen)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: windows-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (Windows)
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: ${{ github.event.inputs.qpa }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install -r requirements-dev.txt

      - name: Unit tests
        # Bounded and parallel, like the gate in the preview build: a test
        # that stalls on the network must fail here, not hang the runner.
        # -v so a timeout log names the culprit.
        #
        # The dispatch inputs are for chasing a Windows-only failure without
        # paying for the whole suite. `only` runs one file, SERIAL on purpose:
        # a crashing test kills the run at once, while under xdist the
        # surviving workers wait on the dead one until the bound. `qpa` swaps
        # QT_QPA_PLATFORM, which is how a bug in the offscreen platform
        # plugin is told apart from a bug in the app.
        timeout-minutes: 15
        shell: pwsh
        run: |
          $only = "${{ github.event.inputs.only }}"
          if ($only) {
            python -m pytest $only.Split(" ") -v
          } else {
            python -m pytest tests/unit -v -n auto --dist loadfile
          }

