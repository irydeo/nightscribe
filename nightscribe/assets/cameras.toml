# NightScribe - camera preset catalogue (photometric profile)
#
# This file is the DATA of the camera profile; the code that reads it and
# turns a preset into config keys lives in nightscribe/core/cameras.py. To
# add, fix or remove a camera, edit THIS file: no Python involved.
#
# Two files are merged at load: this bundled one (the source of truth) and an
# optional user file at <config>/cameras.toml. In the user file you can add a
# new [[camera]] (a new key), correct an existing one (same key: the fields
# you write replace the bundled ones), or hide a bundled one with the
# top-level `hide = ["key", ...]`. A field you do not publish is simply
# omitted, and the profile reads it as "unknown" (None).
#
# Fields per [[camera]]:
#   key            unique id (also the config value of cam_preset)
#   family         one of family_order (groups the combo)
#   sensor         the sensor's name, with its technology and bit depth
#   cameras        the commercial cameras that use it (comma-separated; each
#                  one is also an alias the lookup accepts)
#   pixel_um       pixel pitch, microns
#   resolution_w/h the native frame, pixels
#   sensor_w_mm/h  the active area, millimetres
#   bit_depth      ADC bits (12, 14 or 16)
#   full_well_e    full well, electrons (native mode; the extended one is
#                  noted in a comment when the vendor quotes both)
#   read_noise_e   read noise at the gain where photometry is done
#   read_noise_note which gain mode that is, and the range
#   dark_current_e_s  dark current, e-/pixel/s ...
#   dark_temp_c       ... at THIS temperature (they travel together)
#   exp_min_s/max_s   the exposure range the camera supports, seconds
#   regime         "short" (sCMOS that groups many short frames) | "normal"
#   linearity_frac the fraction of the lesser of the full well (at the user's
#                  gain) and the ADC ceiling where the sensor is still
#                  linear. 0.9 is the house default; the KAF datasheets
#                  publish "linear 1-90% of Vsat".
#   linearity_adu  an ABSOLUTE measured linearity (GSENSE400 only); when it
#                  is present it wins over linearity_frac
#   linearity_note a short note about the linearity suggestion
#   source         where the figures come from (datasheet / product page)
#
# Sources are the manufacturers' datasheets and product pages (ZWO, QHYCCD,
# Atik, Gpixel, ON Semiconductor / Truesense, Sony) and, for the GSENSE400,
# the Irydeo QHY42Pro article (linearity measured at gain 6, offset 60).

# The families the combo groups by, in the order they are shown. A family is
# a sensor-generation story, so the observer scrolls to the kind of camera
# they own instead of reading one flat list.
family_order = [
    "Sony CMOS (16-bit)",
    "Sony CMOS (12/14-bit)",
    "Gpixel sCMOS",
    "CCD Sony",
    "CCD Kodak/ON",
]


