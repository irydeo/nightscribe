# NightScribe - Rolling preview builds (Windows + Linux)
#
# One workflow, one rolling pre-release per branch. On a push to main it
# builds the Windows app (portable zip + Inno Setup installer) AND the Linux
# packages (.deb + .rpm), after the unit suite passes, and publishes them
# TOGETHER as preview-<branch>. Testers always download the latest build from
# the Releases page, no GitHub account needed.
#
# The Windows and Linux builds keep their own jobs, and the Windows one keeps
# its own unit-test run (it catches Windows-only failures). The gate is the
# ubuntu run; a red suite publishes nothing.

name: Preview

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write   # needed to publish the pre-release

concurrency:
  group: preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ gate
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      suffix: ${{ steps.ver.outputs.suffix }}
      label: ${{ steps.ver.outputs.label }}
    steps:
      - name: Checkout (full history for setuptools-scm)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Qt runtime libraries
        # PySide6's wheel links a few system libraries the headless runner
        # does not carry (libEGL/libGL and the xcb set). Without them the GUI
        # test modules fail to import at all ("libEGL.so.1: cannot open
        # shared object file").
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libglib2.0-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - name: OpenCL (so the GPU path's tests actually run)
        # The OpenCL backend is ON by default and ships with the app, but its
        # 32 tests used to SKIP on every runner (no ICD loader), so the
        # hand-written kernels were only ever exercised on the author's card.
        # pocl is a CPU OpenCL implementation: with it installed the tests run
        # in CI too, on the same kernels the observers get.
        run: |
          sudo apt-get install -y --no-install-recommends \
            ocl-icd-libopencl1 pocl-opencl-icd

      - name: Install the package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install -r requirements-dev.txt

      - name: Unit tests (a red suite publishes nothing)
        timeout-minutes: 45
        run: |
          python -m pytest tests/unit -n auto --dist loadfile -q 2>&1 | tee pytest.log
          code=${PIPESTATUS[0]}
          # The raw log is not readable without admin rights; surface the
          # failure as annotations, which ARE readable from outside.
          grep -E "^(FAILED|ERROR) " pytest.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          grep -aE "ImportError|ModuleNotFoundError|cannot open shared object|No module named|libGL|libEGL|libxkb" pytest.log | sort -u | head -25 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit $code

      - name: Resolve the package version
        id: ver
        run: |
          v=$(python -c "from importlib.metadata import version; print(version('nightscribe'))")
          sha7=$(echo "${GITHUB_SHA}" | cut -c1-7)
          # `version` stays the PEP 440 string setuptools-scm produced, local
          # segment ('+') included. It is what the Linux packagers record in the
          # *.dist-info/METADATA, and RPM's dependency generator parses that
          # field with `packaging`, which rejects anything that is not PEP 440
          # ("Invalid version") and kills the whole build. Swapping '+' for '-'
          # (or '.') made the .rpm die on 2026-10-15. Only the file-name label
          # drops the '+', where it is legal but awkward.
          label="${v//+/-}-preview.$sha7"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "suffix=-preview.$sha7" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "version: $v / label: $label"

  # ------------------------------------------------------------- windows
  windows:
    name: Build Windows preview
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout (full history for setuptools-scm)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install -r requirements-dev.txt

      - name: Unit tests on Windows (a red suite publishes nothing)
        timeout-minutes: 45
        run: python -m pytest tests/unit -n auto --dist loadfile -v

      - name: Fetch Find_Orb (bundled with the app, ADR-080)
        shell: pwsh
        run: |
          # The non-interactive `fo64.exe` plus the interactive console and
          # its data files, into findorb-payload/. The PyInstaller spec picks
          # the folder up and ships it as findorb/ inside the bundle, so the
          # orbit check works with no path to set. NightScribe does not
          # redistribute it outside this build (GPLv2 + a no-commercial
          # clause; the installer shows the notice).
          New-Item -ItemType Directory -Force -Path findorb-payload | Out-Null
          Invoke-WebRequest -Uri https://www.projectpluto.com/find_c64.zip `
            -OutFile find_c64.zip
          Expand-Archive find_c64.zip -DestinationPath findorb-payload -Force
          Invoke-WebRequest -Uri https://www.projectpluto.com/devel/fo64.exe `
            -OutFile findorb-payload\fo64.exe
          Get-ChildItem findorb-payload | Select-Object -ExpandProperty Name

      - name: Build with PyInstaller
        run: pyinstaller installer/nightscribe.spec --clean --noconfirm

      - name: Smoke test the frozen binary
        run: dist\nightscribe\nightscribe.exe --help

      - name: Zip the portable build
        shell: pwsh
        run: |
          $zip = "dist\NightScribe-${{ needs.test.outputs.label }}-windows-x64.zip"
          Compress-Archive -Path dist\nightscribe -DestinationPath $zip
          echo "zip: $zip"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile the installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ needs.test.outputs.version }} "/DAppSuffix=${{ needs.test.outputs.suffix }}" installer\nightscribe.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload the Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/NightScribe-*-windows-x64.zip
            dist/NightScribeSetup-*.exe

  # ------------------------------------------------------------------ .deb
  deb:
    name: Build .deb (amd64)
    needs: test
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates curl bzip2 tar dpkg-dev python3 appstream

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare the Find_Orb payload (amd64)
        run: sh tools/fetch_findorb.sh findorb-payload

      - name: Build the .deb
        run: |
          python3 tools/build_deb.py \
            --version "${{ needs.test.outputs.version }}" \
            --findorb findorb-payload --arch amd64 --out dist
          ls -la dist

      - name: Validate the AppStream metainfo
        # A package whose software centre shows no licence, no developer and
        # no icon is what the observer reported on Ubuntu; this gate keeps it
        # from shipping again (ADR-087 rev).
        run: appstreamcli validate installer/io.github.irydeo.nightscribe.metainfo.xml

      - name: Upload the .deb
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  # ------------------------------------------------------------------ .rpm
  rpm:
    name: Build .rpm (x86_64)
    needs: test
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install build tools
        run: |
          dnf install -y git ca-certificates curl bzip2 tar gzip rpm-build \
            python3-devel appstream

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare the Find_Orb payload (linux-64)
        run: sh tools/fetch_findorb.sh findorb-payload

      - name: Validate the AppStream metainfo
        run: appstreamcli validate installer/io.github.irydeo.nightscribe.metainfo.xml

      - name: Build the .rpm
        run: |
          ver="${{ needs.test.outputs.version }}"
          # The version feeds BOTH the spec's Version: and the dist-info
          # METADATA. RPM takes the '+' of a PEP 440 local segment (rpmvercmp
          # treats it as a separator) and PEP 440 needs it, so it is left as it
          # is; a '-' would be illegal in RPM, but PEP 440 never emits one.
          top="$PWD/rpmbuild"
          mkdir -p "$top"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          tar czf "$top/SOURCES/nightscribe-$ver.tar.gz" \
            --exclude=.venv --exclude=.git --exclude=dist --exclude=rpmbuild \
            --transform "s,^\.,nightscribe-$ver," .
          set +e
          rpmbuild -bb --define "_version $ver" \
            --define "_topdir $top" installer/rpm/nightscribe.spec > rpm.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            tail -12 rpm.log | while IFS= read -r line; do echo "::error::${line}"; done
            exit $code
          fi
          mkdir -p dist
          find "$top/RPMS" -name '*.rpm' -exec cp {} dist/ \;
          ls -la dist

      - name: Upload the .rpm
        uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm

  # -------------------------------------------------------------- publish
  # Tolerant on purpose: publish whatever built, so a broken Windows build
  # does not throw away a good .deb (and vice versa).
  publish:
    name: Publish the rolling pre-release
    needs: [test, windows, deb, rpm]
    if: always() && needs.test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect the artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist || true
          files=$(ls dist/* 2>/dev/null || true)
          if [ -z "$files" ]; then
            echo "nothing was built; nothing to publish"
            exit 0
          fi
          sha=$(echo "${GITHUB_SHA}" | cut -c1-7)
          label="${{ needs.test.outputs.label }}"
          ver="${{ needs.test.outputs.version }}"
          tag="preview-${{ github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --cleanup-tag --yes
          fi
          notes="Preview build of branch **${{ github.ref_name }}** at commit \`$sha\` (version \`$ver\`), built by GitHub Actions after the unit test suite passed.

          - **NightScribeSetup-$label.exe**: Windows installer (per-user, no admin rights needed).
          - **NightScribe-$label-windows-x64.zip**: Windows portable build; unzip and run \`nightscribe.exe gui\`.
          - **nightscribe_${ver}_amd64.deb**: Debian 13+ / Ubuntu 25.10+ (system Python; includes Find_Orb).
          - **nightscribe-*.x86_64.rpm**: Fedora 42+ / openSUSE Tumbleweed (system Python; includes Find_Orb).

          The Windows binaries are unsigned, so SmartScreen will warn: choose *More info -> Run anyway*. Other distros (Ubuntu 24.04 LTS, ...) install manually: see docs/ASTROMETRY.

          Report issues at https://github.com/irydeo/nightscribe/issues"

          gh release create "$tag" --target "${GITHUB_SHA}" --prerelease \
            --title "Preview ${{ github.ref_name }} ($sha)" \
            --notes "$notes" $files
