# NightScribe: the EXOTIC environment, pinned.
#
# This file is the ONLY thing that decides what the published environment
# contains, so the same tag always unpacks the same stack. It is resolved with
# uv from one line, `exotic==4.3.1`, for CPython 3.11 on Windows x64.
#
# Regenerate it (both files, from the repository root) with:
#
#   uv pip compile tools/exotic-env/requirements.in \
#       --python-platform x86_64-pc-windows-msvc --python-version 3.11 \
#       --no-header -o tools/exotic-env/windows.lock
#
# Why 3.11 and not the newest: EXOTIC pins numpy 1.26, and numpy 1.26 has no
# wheels for 3.13. 3.11 is the version a full `pip install exotic` was verified
# on (EXOTIC 4.3.1, 2026-10-20), and it is supported until October 2027.
#
# Why two files: the only platform-conditional dependency of EXOTIC is the
# sampler (dynesty on Windows, ultranest everywhere else), and the rest of the
# tree differs too (colorama, pywin32-ctypes). A Python environment carries
# compiled binaries, so it cannot be shared between systems.
#
# The `# via` comments are uv's own record of what pulled each pin in; they are
# the reason a dependency bump is reviewable.


